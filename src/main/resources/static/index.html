<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Task Manager - Full Stack CRUD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 30px 15px; }
        .container { max-width: 960px; margin: 0 auto; }
        header {
            background: #1e293b; color: #fff; padding: 20px 25px;
            border-radius: 10px; margin-bottom: 25px;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { font-size: 1.35rem; }
        .badge-env { background: #3b82f6; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; }
        .card {
            background: #fff; padding: 22px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); margin-bottom: 22px;
        }
        .card h2 { font-size: 1.1rem; margin-bottom: 15px; color: #1e293b; }
        .form-grid {
            display: grid; grid-template-columns: 1fr 1.5fr 1fr auto;
            gap: 12px; align-items: end;
        }
        .filter-bar {
            display: grid; grid-template-columns: 1.5fr 1fr auto;
            gap: 12px; margin-bottom: 16px;
        }
        @media (max-width: 720px) {
            .form-grid, .filter-bar { grid-template-columns: 1fr; }
        }
        label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 5px; color: #475569; }
        input, select {
            width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1;
            border-radius: 6px; font-size: 0.92rem;
        }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
        .btn-group { display: flex; gap: 8px; }
        button {
            padding: 10px 16px; border: none; border-radius: 6px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #475569; color: #fff; }
        .btn-cancel { background: #64748b; color: #fff; display: none; }
        .btn-edit { background: #f59e0b; color: #fff; padding: 6px 12px; font-size: 0.82rem; }
        .btn-delete { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 0.82rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; font-size: 0.82rem; text-transform: uppercase; }
        .dev-tag {
            display: inline-block; font-size: 0.75rem; background: #f1f5f9;
            color: #475569; padding: 2px 7px; border-radius: 4px; margin-left: 6px;
        }
        .status-pill {
            display: inline-block; padding: 4px 10px; border-radius: 12px;
            font-size: 0.8rem; font-weight: 600; background: #e0f2fe; color: #0369a1;
        }
        .status-completed { background: #dcfce7; color: #15803d; }
        .empty-msg { text-align: center; padding: 25px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Developer Project Tasks (Spring Boot + MySQL)</h1>
        <span class="badge-env" id="buildEnv">Loading build env...</span>
    </header>

    <!-- CREATE / UPDATE FORM -->
    <div class="card">
        <h2 id="formTitle">Add New Task</h2>
        <form id="taskForm">
            <input type="hidden" id="taskId">
            <div class="form-grid">
                <div>
                    <label for="developerName">Developer Name</label>
                    <input type="text" id="developerName" placeholder="e.g. Yedukondalu" required>
                </div>
                <div>
                    <label for="taskName">Task Description</label>
                    <input type="text" id="taskName" placeholder="e.g. Build REST API" required>
                </div>
                <div>
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="">Auto (Developer Build)</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-primary" id="submitBtn">Add Task</button>
                    <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()">Cancel</button>
                </div>
            </div>
        </form>
    </div>

    <!-- SEARCH, FILTER & TABLE -->
    <div class="card">
        <h2>Saved Tasks in MySQL</h2>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="Search tasks by keyword..." oninput="handleSearch()">
            <select id="statusFilter" onchange="handleStatusFilter()">
                <option value="">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>
            <button type="button" class="btn-secondary" onclick="clearFilters()">Reset Filters</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Developer (FK)</th>
                    <th>Task</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="taskTableBody">
                <tr><td colspan="5" class="empty-msg">Loading tasks...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = '/api/tasks';

    document.addEventListener('DOMContentLoaded', () => {
        loadBuildEnv();
        fetchTasks(API_URL);
    });

    async function loadBuildEnv() {
        try {
            const res = await fetch('/api/build');
            document.getElementById('buildEnv').textContent = await res.text();
        } catch {
            document.getElementById('buildEnv').textContent = 'Backend Offline';
        }
    }

    async function fetchTasks(url) {
        const tbody = document.getElementById('taskTableBody');
        try {
            const response = await fetch(url);
            const tasks = await response.json();

            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">No matching tasks found in MySQL.</td></tr>';
                return;
            }

            tbody.innerHTML = tasks.map(task => {
                const devIdBadge = task.developerProfile ? `<span class="dev-tag">Dev #${task.developerProfile.id}</span>` : '';
                return `
                    <tr>
                        <td>#${task.id}</td>
                        <td><strong>${escapeHtml(task.developerName)}</strong>${devIdBadge}</td>
                        <td>${escapeHtml(task.taskName)}</td>
                        <td>
                            <span class="status-pill ${task.status === 'Completed' ? 'status-completed' : ''}">
                                ${escapeHtml(task.status || '')}
                            </span>
                        </td>
                        <td>
                            <button class="btn-edit" onclick="editTask(${task.id})">Edit</button>
                            <button class="btn-delete" onclick="deleteTask(${task.id})">Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');
        } catch {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">Error loading tasks from server.</td></tr>';
        }
    }

    // Live Keyword Search
    function handleSearch() {
        document.getElementById('statusFilter').value = '';
        const keyword = document.getElementById('searchInput').value.trim();
        if (!keyword) {
            fetchTasks(API_URL);
        } else {
            fetchTasks(`${API_URL}/search?keyword=${encodeURIComponent(keyword)}`);
        }
    }

    // Status Filter
    function handleStatusFilter() {
        document.getElementById('searchInput').value = '';
        const status = document.getElementById('statusFilter').value;
        if (!status) {
            fetchTasks(API_URL);
        } else {
            fetchTasks(`${API_URL}/status?value=${encodeURIComponent(status)}`);
        }
    }

    function clearFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('statusFilter').value = '';
        fetchTasks(API_URL);
    }

    // Create or Update
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('taskId').value;
        const payload = {
            developerName: document.getElementById('developerName').value.trim(),
            taskName: document.getElementById('taskName').value.trim(),
            status: document.getElementById('status').value
        };

        await fetch(id ? `${API_URL}/${id}` : API_URL, {
            method: id ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        resetForm();
        clearFilters();
    });

    async function editTask(id) {
        const res = await fetch(`${API_URL}/${id}`);
        const task = await res.json();

        document.getElementById('taskId').value = task.id;
        document.getElementById('developerName').value = task.developerName;
        document.getElementById('taskName').value = task.taskName;

        const statusSelect = document.getElementById('status');
        if (![...statusSelect.options].some(opt => opt.value === task.status)) {
            statusSelect.add(new Option(task.status, task.status));
        }
        statusSelect.value = task.status;

        document.getElementById('formTitle').textContent = `Edit Task #${task.id}`;
        document.getElementById('submitBtn').textContent = 'Update Task';
        document.getElementById('cancelBtn').style.display = 'inline-block';
    }

    async function deleteTask(id) {
        if (!confirm(`Delete Task #${id} permanently from MySQL?`)) return;
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        clearFilters();
    }

    function resetForm() {
        document.getElementById('taskForm').reset();
        document.getElementById('taskId').value = '';
        document.getElementById('formTitle').textContent = 'Add New Task';
        document.getElementById('submitBtn').textContent = 'Add Task';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
